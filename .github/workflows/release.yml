name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: QuickSketch
            archive: linux-x86_64.tar.gz
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: QuickSketch.exe
            archive: windows-x86_64.zip
    env:
      RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libwayland-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          archive="../QuickSketch-${version}-${{ matrix.archive }}"
          (
            cd dist
            if [ "${{ matrix.archive }}" = "windows-x86_64.zip" ]; then
              tar -a -cf "$archive" "${{ matrix.binary }}"
            else
              tar -czf "$archive" "${{ matrix.binary }}"
            fi
          )

      - uses: actions/upload-artifact@v4
        with:
          name: QuickSketch-${{ matrix.archive }}
          path: QuickSketch-*-${{ matrix.archive }}

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: QuickSketch-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          tag="v${version}"
          git tag -f "$tag"
          git push -f origin "refs/tags/${tag}"
          notes="QuickSketch ${version}, built from ${GITHUB_SHA}.

          The Linux binary needs libxkbcommon, the Wayland client libraries, XCB, and a Vulkan loader."
          mapfile -t files < <(find dist -type f -name 'QuickSketch-*' | sort)
          if [ "${#files[@]}" -ne 2 ]; then
            echo "expected 2 release archives, found ${#files[@]}"
            find dist -print
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --title "QuickSketch ${version}" --notes "$notes"
          else
            gh release create "$tag" "${files[@]}" --title "QuickSketch ${version}" --notes "$notes"
          fi
